<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quebra-cabeça do Oceano - Arraial do Cabo</title>

    <!-- Favicon inline SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧩</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #7db9e8 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Bolhas animadas de fundo */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rise 20s infinite ease-in;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rise {
            to {
                bottom: 110vh;
                transform: translateX(100px);
                opacity: 0;
            }
        }

        .bubble:nth-child(1) { width: 60px; height: 60px; left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 40px; height: 40px; left: 25%; animation-delay: 3s; }
        .bubble:nth-child(3) { width: 80px; height: 80px; left: 50%; animation-delay: 6s; }
        .bubble:nth-child(4) { width: 50px; height: 50px; left: 70%; animation-delay: 2s; }
        .bubble:nth-child(5) { width: 70px; height: 70px; left: 85%; animation-delay: 5s; }
        .bubble:nth-child(6) { width: 45px; height: 45px; left: 15%; animation-delay: 8s; }
        .bubble:nth-child(7) { width: 65px; height: 65px; left: 90%; animation-delay: 1s; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 0.8s ease;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .level-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .level-btn.active {
            background: #27ae60;
        }

        .level-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .score-display {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .score-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .puzzle-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-top: 30px;
        }

        .puzzle-board {
            display: grid;
            gap: 3px;
            background: #34495e;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .puzzle-board.easy {
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
        }

        .puzzle-board.medium {
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
        }

        .puzzle-board.hard {
            grid-template-columns: repeat(5, 85px);
            grid-template-rows: repeat(5, 85px);
        }

        .puzzle-piece {
            background-size: 300px 300px;
            border-radius: 8px;
            cursor: move;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .puzzle-piece:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .puzzle-piece.dragging {
            opacity: 0.5;
            transform: scale(1.1);
            z-index: 100;
        }

        .puzzle-piece.correct {
            animation: correctPiece 0.5s ease;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.8);
        }

        @keyframes correctPiece {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .empty-slot {
            background: rgba(52, 73, 94, 0.3);
            border: 2px dashed #7f8c8d;
            border-radius: 8px;
            position: relative;
        }

        .empty-slot.drag-over {
            background: rgba(52, 152, 219, 0.3);
            border-color: #3498db;
            transform: scale(1.05);
        }

        .pieces-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 600px;
            padding: 20px;
            background: rgba(236, 240, 241, 0.8);
            border-radius: 15px;
            min-height: 150px;
        }

        .tray-piece {
            cursor: grab;
            transition: all 0.3s ease;
        }

        .tray-piece:active {
            cursor: grabbing;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(189, 195, 199, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            transition: width 0.5s ease;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .success-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            animation: modalSlideIn 0.5s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .success-content h2 {
            color: #27ae60;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .success-emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .educational-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .modal-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .next-level-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .play-again-btn {
            background: #3498db;
            color: white;
        }

        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .hint-button {
            background: #f39c12;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hint-button:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .hint-button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .timer {
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .game-container {
                padding: 20px;
            }

            .puzzle-board.easy {
                grid-template-columns: repeat(3, 90px);
                grid-template-rows: repeat(3, 90px);
            }

            .puzzle-board.medium {
                grid-template-columns: repeat(4, 75px);
                grid-template-rows: repeat(4, 75px);
            }

            .puzzle-board.hard {
                grid-template-columns: repeat(5, 65px);
                grid-template-rows: repeat(5, 65px);
            }

            .puzzle-piece {
                background-size: 240px 240px;
            }

            .game-info {
                justify-content: center;
            }

            .back-button {
                padding: 8px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Bolhas animadas de fundo -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <a href="index.html" class="back-button">← Voltar ao Início</a>

    <div class="container">
        <header>
            <h1>🧩 Quebra-cabeça do Oceano</h1>
            <p>Monte o ecossistema marinho e descubra a importância da conservação!</p>
        </header>

        <main class="game-container">
            <div class="game-info">
                <div class="level-selector">
                    <span style="font-weight: bold; color: #2c3e50;">Nível:</span>
                    <button class="level-btn active" data-level="easy">Fácil (3x3)</button>
                    <button class="level-btn" data-level="medium">Médio (4x4)</button>
                    <button class="level-btn" data-level="hard">Difícil (5x5)</button>
                </div>

                <div class="score-display">
                    <div class="score-item">Pontos: <span id="score">0</span></div>
                    <div class="timer">⏱️ <span id="timer">00:00</span></div>
                </div>

                <button class="hint-button" id="hintBtn">💡 Dica (3)</button>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar">
                    <span id="progressText">0%</span>
                </div>
            </div>

            <div class="puzzle-area">
                <div class="puzzle-board easy" id="puzzleBoard">
                    <!-- Puzzle pieces will be generated here -->
                </div>

                <div class="pieces-tray" id="piecesTray">
                    <!-- Movable pieces will be generated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Success Modal -->
    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-emoji">🎉</div>
            <h2>Parabéns!</h2>
            <p>Você completou o quebra-cabeça!</p>

            <div class="educational-message" id="educationalMessage">
                <!-- Educational message will be inserted here -->
            </div>

            <div style="margin: 20px 0; font-size: 1.2em;">
                <strong>Tempo:</strong> <span id="finalTime">00:00</span><br>
                <strong>Pontos:</strong> <span id="finalScore">0</span>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn next-level-btn" id="nextLevelBtn">Próximo Nível</button>
                <button class="modal-btn play-again-btn" id="playAgainBtn">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <script>
        class OceanPuzzleGame {
            constructor() {
                this.currentLevel = 'easy';
                this.score = 0;
                this.hints = 3;
                this.startTime = null;
                this.timerInterval = null;
                this.completedPieces = 0;
                this.totalPieces = 9;
                this.isGameActive = false;

                // Ocean ecosystem images (using CSS gradients to simulate ocean scenes)
                this.oceanScenes = {
                    healthy: {
                        easy: 'linear-gradient(45deg, #006994 0%, #13B497 25%, #8FD14F 50%, #F9E79F 75%, #85C1E2 100%)',
                        medium: 'linear-gradient(45deg, #006994 0%, #13B497 20%, #8FD14F 40%, #F9E79F 60%, #85C1E2 80%, #AED6F1 100%)',
                        hard: 'linear-gradient(45deg, #006994 0%, #13B497 16%, #8FD14F 32%, #F9E79F 48%, #85C1E2 64%, #AED6F1 80%, #D6EAF8 100%)'
                    },
                    polluted: {
                        easy: 'linear-gradient(45deg, #4A4A4A 0%, #8B4513 25%, #D2691E 50%, #CD853F 75%, #8B7355 100%)',
                        medium: 'linear-gradient(45deg, #4A4A4A 0%, #8B4513 20%, #D2691E 40%, #CD853F 60%, #8B7355 80%, #A0826D 100%)',
                        hard: 'linear-gradient(45deg, #4A4A4A 0%, #8B4513 16%, #D2691E 32%, #CD853F 48%, #8B7355 64%, #A0826D 80%, #BC9A6A 100%)'
                    }
                };

                this.currentScene = 'healthy';
                this.educationalMessages = {
                    healthy: [
                        "🌊 Excelente! Você montou um ecossistema marinho saudável! Oceanos limpos são essenciais para a vida no planeta. Cada peça colocada corretamente representa um equilíbrio natural que devemos proteger.",
                        "🐠 Parabéns! Este oceano saudável mostra a beleza de Arraial do Cabo. Coral vibrante, peixes coloridos e água cristalina - este é o ambiente que precisamos preservar para as futuras gerações.",
                        "🦈 Fantástico! Você demonstrou como um ecossistema equilibrado funciona. A vida marinha prospera quando protegemos nossos oceanos da poluição e da pesca excessiva."
                    ],
                    polluted: [
                        "⚠️ Este oceano está sofrendo com a poluição! Plásticos, lixo e contaminação destroem habitats marinhos. Cada um de nós pode ajudar a reduzir o lixo e proteger a vida oceânica.",
                        "🏭 Que tristeza! O poluição industrial e o esgoto estão matando nossos recifes. Precisamos exigir tratamento adequado de resíduos e alternativas mais limpas para nossas indústrias.",
                        "🛑 Este cenário mostra o futuro se não agirmos agora! Microplásticos, óleo e produtos químicos contaminam a cadeia alimentar. Reduza, reutilize e recicle!"
                    ]
                };

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.startNewGame();
            }

            setupEventListeners() {
                // Level selection
                document.querySelectorAll('.level-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (!btn.disabled) {
                            this.changeLevel(e.target.dataset.level);
                        }
                    });
                });

                // Hint button
                document.getElementById('hintBtn').addEventListener('click', () => {
                    this.useHint();
                });

                // Modal buttons
                document.getElementById('nextLevelBtn').addEventListener('click', () => {
                    this.nextLevel();
                });

                document.getElementById('playAgainBtn').addEventListener('click', () => {
                    this.playAgain();
                });

                // Close modal on background click
                document.getElementById('successModal').addEventListener('click', (e) => {
                    if (e.target.id === 'successModal') {
                        this.closeModal();
                    }
                });
            }

            changeLevel(level) {
                this.currentLevel = level;
                document.querySelectorAll('.level-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-level="${level}"]`).classList.add('active');

                this.startNewGame();
            }

            startNewGame() {
                this.score = 0;
                this.hints = 3;
                this.completedPieces = 0;
                this.isGameActive = true;

                // Update UI
                document.getElementById('score').textContent = this.score;
                document.getElementById('hintBtn').textContent = `💡 Dica (${this.hints})`;
                document.getElementById('hintBtn').disabled = false;

                // Alternate between healthy and polluted scenes
                this.currentScene = Math.random() > 0.5 ? 'healthy' : 'polluted';

                // Setup puzzle board based on level
                this.setupPuzzleBoard();

                // Start timer
                this.startTimer();

                // Update progress
                this.updateProgress();
            }

            setupPuzzleBoard() {
                const board = document.getElementById('puzzleBoard');
                const tray = document.getElementById('piecesTray');

                // Clear existing content
                board.innerHTML = '';
                tray.innerHTML = '';

                // Set board class
                board.className = `puzzle-board ${this.currentLevel}`;

                // Calculate grid dimensions
                const dimensions = {
                    easy: 3,
                    medium: 4,
                    hard: 5
                };

                const gridSize = dimensions[this.currentLevel];
                this.totalPieces = gridSize * gridSize;

                // Create puzzle pieces
                const pieces = [];
                for (let i = 0; i < this.totalPieces; i++) {
                    pieces.push(i);
                }

                // Shuffle pieces
                const shuffledPieces = [...pieces].sort(() => Math.random() - 0.5);

                // Create board slots
                pieces.forEach((piece, index) => {
                    const slot = document.createElement('div');
                    slot.className = 'empty-slot';
                    slot.dataset.correctPosition = index;

                    // Add drag and drop functionality
                    slot.addEventListener('dragover', this.handleDragOver.bind(this));
                    slot.addEventListener('drop', this.handleDrop.bind(this));
                    slot.addEventListener('dragleave', this.handleDragLeave.bind(this));

                    board.appendChild(slot);
                });

                // Create movable pieces in tray
                shuffledPieces.forEach((pieceIndex, originalIndex) => {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece tray-piece';
                    piece.dataset.pieceIndex = pieceIndex;
                    piece.draggable = true;

                    // Set background image portion
                    const row = Math.floor(pieceIndex / gridSize);
                    const col = pieceIndex % gridSize;
                    const pieceSize = 100 / gridSize;

                    piece.style.backgroundImage = this.oceanScenes[this.currentScene][this.currentLevel];
                    piece.style.backgroundPosition = `${col * pieceSize}% ${row * pieceSize}%`;
                    piece.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;

                    // Add drag events
                    piece.addEventListener('dragstart', this.handleDragStart.bind(this));
                    piece.addEventListener('dragend', this.handleDragEnd.bind(this));

                    // Touch events for mobile
                    piece.addEventListener('touchstart', this.handleTouchStart.bind(this));
                    piece.addEventListener('touchmove', this.handleTouchMove.bind(this));
                    piece.addEventListener('touchend', this.handleTouchEnd.bind(this));

                    tray.appendChild(piece);
                });
            }

            handleDragStart(e) {
                e.target.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('pieceIndex', e.target.dataset.pieceIndex);
                e.dataTransfer.setData('pieceId', e.target.id || `piece-${Date.now()}`);
            }

            handleDragEnd(e) {
                e.target.classList.remove('dragging');
            }

            handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';

                if (e.target.classList.contains('empty-slot')) {
                    e.target.classList.add('drag-over');
                }
            }

            handleDragLeave(e) {
                if (e.target.classList.contains('empty-slot')) {
                    e.target.classList.remove('drag-over');
                }
            }

            handleDrop(e) {
                e.preventDefault();

                const slot = e.target.classList.contains('empty-slot') ? e.target : e.target.closest('.empty-slot');
                if (!slot) return;

                slot.classList.remove('drag-over');

                const pieceIndex = e.dataTransfer.getData('pieceIndex');
                const correctPosition = parseInt(slot.dataset.correctPosition);

                // Check if piece is already placed
                if (slot.children.length > 0) return;

                // Find and move the piece
                const piece = document.querySelector(`[data-piece-index="${pieceIndex}"]`);
                if (!piece) return;

                slot.appendChild(piece);
                piece.classList.remove('tray-piece');
                piece.draggable = false;

                // Check if piece is in correct position
                if (parseInt(pieceIndex) === correctPosition) {
                    piece.classList.add('correct');
                    this.completedPieces++;
                    this.score += 100;
                    this.updateProgress();
                    this.updateScore();

                    // Check if puzzle is complete
                    if (this.completedPieces === this.totalPieces) {
                        this.completePuzzle();
                    }
                } else {
                    // Wrong position - piece can be dragged again
                    piece.draggable = true;
                    piece.addEventListener('dragstart', this.handleDragStart.bind(this));
                    piece.addEventListener('dragend', this.handleDragEnd.bind(this));

                    // Add animation for wrong placement
                    piece.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        piece.style.animation = '';
                    }, 500);
                }
            }

            // Touch events for mobile support
            handleTouchStart(e) {
                const touch = e.touches[0];
                this.touchedPiece = e.target;
                this.touchedPiece.classList.add('dragging');

                // Create a drag ghost
                this.dragGhost = e.target.cloneNode(true);
                this.dragGhost.style.position = 'fixed';
                this.dragGhost.style.zIndex = '1000';
                this.dragGhost.style.pointerEvents = 'none';
                this.dragGhost.style.opacity = '0.8';
                document.body.appendChild(this.dragGhost);

                this.updateDragGhostPosition(touch.clientX, touch.clientY);
            }

            handleTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                this.updateDragGhostPosition(touch.clientX, touch.clientY);

                // Check what's under the touch
                const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elementBelow && elementBelow.classList.contains('empty-slot')) {
                    // Remove highlight from previous slots
                    document.querySelectorAll('.empty-slot').forEach(slot => {
                        slot.classList.remove('drag-over');
                    });
                    elementBelow.classList.add('drag-over');
                }
            }

            handleTouchEnd(e) {
                const touch = e.changedTouches[0];

                // Clean up drag ghost
                if (this.dragGhost) {
                    document.body.removeChild(this.dragGhost);
                    this.dragGhost = null;
                }

                this.touchedPiece.classList.remove('dragging');

                // Check if dropped on a valid slot
                const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elementBelow && elementBelow.classList.contains('empty-slot')) {
                    elementBelow.classList.remove('drag-over');

                    // Simulate drop
                    const mockEvent = {
                        target: elementBelow,
                        preventDefault: () => {}
                    };

                    // Set dataTransfer simulation
                    mockEvent.dataTransfer = {
                        getData: (type) => this.touchedPiece.dataset.pieceIndex
                    };

                    this.handleDrop(mockEvent);
                }
            }

            updateDragGhostPosition(x, y) {
                if (this.dragGhost) {
                    this.dragGhost.style.left = `${x - 40}px`;
                    this.dragGhost.style.top = `${y - 40}px`;
                }
            }

            useHint() {
                if (this.hints <= 0 || !this.isGameActive) return;

                this.hints--;
                document.getElementById('hintBtn').textContent = `💡 Dica (${this.hints})`;

                if (this.hints === 0) {
                    document.getElementById('hintBtn').disabled = true;
                }

                // Find an unplaced piece and show its correct position
                const unplacedPieces = document.querySelectorAll('.tray-piece');
                if (unplacedPieces.length === 0) return;

                const randomPiece = unplacedPieces[Math.floor(Math.random() * unplacedPieces.length)];
                const pieceIndex = parseInt(randomPiece.dataset.pieceIndex);
                const correctSlot = document.querySelector(`[data-correct-position="${pieceIndex}"]`);

                if (correctSlot && correctSlot.children.length === 0) {
                    // Highlight the correct slot
                    correctSlot.style.animation = 'pulse 2s ease-in-out 3';
                    setTimeout(() => {
                        correctSlot.style.animation = '';
                    }, 6000);
                }

                // Deduct points for using hint
                this.score = Math.max(0, this.score - 50);
                this.updateScore();
            }

            completePuzzle() {
                this.isGameActive = false;
                this.stopTimer();

                // Calculate bonus points
                const timeBonus = Math.max(0, 300 - this.getElapsedSeconds()) * 2;
                const hintBonus = this.hints * 100;
                this.score += timeBonus + hintBonus;

                // Update final score
                this.updateScore();

                // Show success modal
                setTimeout(() => {
                    this.showSuccessModal();
                }, 500);
            }

            showSuccessModal() {
                const modal = document.getElementById('successModal');
                const messages = this.educationalMessages[this.currentScene];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];

                document.getElementById('educationalMessage').innerHTML = randomMessage;
                document.getElementById('finalTime').textContent = document.getElementById('timer').textContent;
                document.getElementById('finalScore').textContent = this.score;

                modal.style.display = 'flex';

                // Check if next level should be enabled
                const levels = ['easy', 'medium', 'hard'];
                const currentIndex = levels.indexOf(this.currentLevel);
                const nextBtn = document.getElementById('nextLevelBtn');

                if (currentIndex < levels.length - 1) {
                    nextBtn.textContent = 'Próximo Nível';
                    nextBtn.disabled = false;
                } else {
                    nextBtn.textContent = 'Completou Todos!';
                    nextBtn.disabled = true;
                }
            }

            closeModal() {
                document.getElementById('successModal').style.display = 'none';
            }

            nextLevel() {
                this.closeModal();
                const levels = ['easy', 'medium', 'hard'];
                const currentIndex = levels.indexOf(this.currentLevel);

                if (currentIndex < levels.length - 1) {
                    this.changeLevel(levels[currentIndex + 1]);
                } else {
                    this.changeLevel('easy');
                }
            }

            playAgain() {
                this.closeModal();
                this.startNewGame();
            }

            startTimer() {
                this.startTime = Date.now();
                this.timerInterval = setInterval(() => {
                    this.updateTimer();
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            updateTimer() {
                const elapsed = this.getElapsedSeconds();
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                document.getElementById('timer').textContent = display;
            }

            getElapsedSeconds() {
                return Math.floor((Date.now() - this.startTime) / 1000);
            }

            updateProgress() {
                const progress = (this.completedPieces / this.totalPieces) * 100;
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');

                progressBar.style.width = `${progress}%`;
                progressText.textContent = `${Math.round(progress)}%`;
            }

            updateScore() {
                document.getElementById('score').textContent = this.score;
            }
        }

        // Add shake animation for wrong placement
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }

            @keyframes pulse {
                0%, 100% {
                    transform: scale(1);
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
                }
                50% {
                    transform: scale(1.1);
                    box-shadow: 0 0 25px rgba(46, 204, 113, 0.8);
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new OceanPuzzleGame();
        });
    </script>
</body>
</html>
